[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funding-arb-monitor"
version = "0.1.0"
description = "Read-only Hyperliquid funding carry scanner, history store, and alert service."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
funding-arb-monitor = "funding_arb_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/funding_arb_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
